<div class="landing-page" style="background: linear-gradient(rgba(0, 0, 0, 0.5), rgba(0, 0, 0, 0.5)), url(assets/bg.jpeg);">
  <div class="welcome-section">
    <h1 class="welcome-title">Welcome to Menachem's Bottles Collection</h1>
  </div>

  <div class="categories-section">
    <h2 class="section-title">Popular Categories</h2>
    <div class="cards-grid">
      <mat-card 
        *ngFor="let category of categories" 
        class="category-card"
        (click)="navigateToCategory(category)">
        <mat-card-content>
          <div class="category-content">
            <h3 class="category-name">{{ category.name }}</h3>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="countries-section">
    <h2 class="section-title">Popular Countries</h2>
    <div class="cards-grid">
      <mat-card 
        *ngFor="let country of countries" 
        class="country-card"
        (click)="navigateToCountry(country)">
        <mat-card-content>
          <div class="country-content">
            <span class="flag-emoji">{{ country.flagEmoji }}</span>
            <h3>{{ country.name }}</h3>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="my-collection-section" *ngIf="showMyCollectionSection">
    <h2 class="section-title">Learn More</h2>
    <div class="cards-grid">
      <mat-card class="collection-link-card" (click)="navigateToMyCollection()">
        <mat-card-content>
          <div class="collection-link-content">
            <mat-icon class="collection-icon">collections</mat-icon>
            <h3>My Collection</h3>
            <p>Learn about the collection, view galleries, read articles, and get in touch</p>
          </div>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

  <div class="browse-all-section">
    <button mat-raised-button color="primary" class="browse-all-button" (click)="navigateToBrowseAll()">
      Browse All Bottles
    </button>
  </div>
</div>
